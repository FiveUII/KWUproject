version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: resqfood-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-resqfood}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - resqfood-network

  backend:
    build: ./backend
    container_name: resqfood-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-resqfood}
      DB_PORT: 5432
    depends_on:
      - db
    networks:
      - resqfood-network

  frontend:
    build: ./frontend
    container_name: resqfood-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - resqfood-network

volumes:
  postgres_data:

networks:
  resqfood-network:
    driver: bridge
